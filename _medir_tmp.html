<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --red:#fc0025; --panel:#101013; --panel-2:#16161a;
  --border:rgba(255,255,255,.06); --border-md:rgba(255,255,255,.10);
  --text:#f0f0f3; --text-2:#868690; --text-3:#7d7d85;
  --green:#22c55e; --blue:#3b82f6;
  --font:'Montserrat',sans-serif; --radius:14px; --radius-sm:10px;
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
body { font-family:var(--font); background:#07070a; color:var(--text); }
.main { flex:1; margin-left:0; display:flex; flex-direction:column; min-width:0; }
.content { padding:18px 18px 44px; flex:1; }

/* --- copiado de games.php linhas 431/439/456-464 --- */
.card { background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:16px; }
.card-body { padding:16px 18px; }
table.hist { width:100%; border-collapse:collapse; }
table.hist th { text-align:left; font-size:10.5px; font-weight:800; letter-spacing:.6px; text-transform:uppercase;
                color:var(--text-3); padding:0 12px 10px; }
table.hist td { padding:11px 12px; border-top:1px solid var(--border); font-size:13px; }
.pill { font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:20px; white-space:nowrap; }
.pill.aberta { background:rgba(59,130,246,.12); color:var(--blue); }
.pill.acertou { background:rgba(34,197,94,.12); color:var(--green); }
.tbl-wrap { overflow-x:auto; }
</style></head><body>
<div class="main"><div class="content">

<!-- CASO A: nome de evento curto (piso mínimo) -->
<div class="card" id="cardA">
  <div class="card-body tbl-wrap" id="wrapA">
    <table class="hist">
      <thead><tr><th>Evento</th><th>Sua escolha</th><th>Quando</th><th>Resultado</th></tr></thead>
      <tbody>
        <tr><td>MVP</td><td style="color:var(--text-2)">Sim</td>
        <td style="color:var(--text-3);font-size:12px">21/08/2026</td>
        <td><span class="pill acertou" id="pillA">Acertou</span></td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- CASO B: nome de evento realista -->
<div class="card" id="cardB">
  <div class="card-body tbl-wrap" id="wrapB">
    <table class="hist">
      <thead><tr><th>Evento</th><th>Sua escolha</th><th>Quando</th><th>Resultado</th></tr></thead>
      <tbody>
        <tr><td>Quem vence a final da FBA?</td><td style="color:var(--text-2)">Los Angeles Lakers</td>
        <td style="color:var(--text-3);font-size:12px">21/08/2026</td>
        <td><span class="pill acertou" id="pillB">Acertou</span></td></tr>
        <tr><td>Jokic passa de 30 pontos?</td><td style="color:var(--text-2)">Sim</td>
        <td style="color:var(--text-3);font-size:12px">19/08/2026</td>
        <td><span class="pill aberta">Em aberto</span></td></tr>
      </tbody>
    </table>
  </div>
</div>

</div></div>
<script>
window.medir = function(){
  const out = {viewport: window.innerWidth};
  for (const k of ['A','B']) {
    const w = document.getElementById('wrap'+k);
    const p = document.getElementById('pill'+k);
    const ths = w.querySelectorAll('th');
    out['caso'+k] = {
      clientWidth: w.clientWidth,
      scrollWidth: w.scrollWidth,
      colunas: [...ths].map(t => Math.round(t.getBoundingClientRect().width*10)/10),
      pillLeft: p ? Math.round(p.getBoundingClientRect().left) : null,
      pillRight: p ? Math.round(p.getBoundingClientRect().right) : null,
      bordaVisivelDireita: Math.round(w.getBoundingClientRect().right),
      overflowPx: w.scrollWidth - w.clientWidth
    };
  }
  return out;
};
</script>
</body></html>
